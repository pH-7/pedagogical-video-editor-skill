name: Pipeline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner:
    name: Runner availability
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Minimal runner check
        run: echo "GitHub Actions runner available"

  checkout:
    name: Repository checkout
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: test -f scripts/pve.py

  syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python files
        shell: bash
        run: |
          set -o pipefail
          python3 -m compileall -q scripts 2>&1 | tee syntax.log
      - name: Upload syntax diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-syntax-log
          path: syntax.log
          if-no-files-found: warn

  smoke:
    name: Synthetic video render
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run synthetic pipeline
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/test_pipeline.py 2>&1 | tee smoke.log
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-smoke-log
          path: smoke.log
          if-no-files-found: warn
