name: Pipeline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python and FFmpeg smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python
        run: python3 -m compileall -q scripts
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Run synthetic video pipeline
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/test_pipeline.py 2>&1 | tee smoke.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-log
          path: smoke.log
          if-no-files-found: warn
